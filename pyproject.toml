[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visium-brain"
version = "0.1.0"
description = "Analysis pipeline for 10x Genomics Visium HD mouse brain data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "h5py>=3.9",
    "tables>=3.9",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "harmonypy>=0.0.10",
    "squidpy>=1.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "click>=8.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
spatialdata = ["spatialdata>=0.2.0", "spatialdata-io>=0.1.5"]
celltypist = ["celltypist>=1.6.0"]
scvi = ["scvi-tools>=1.1.0"]
segmentation = ["bin2cell>=0.3.2", "stardist>=0.9.1"]
dev = ["pytest>=7", "ruff>=0.4", "ipykernel", "jupyter"]

[project.scripts]
visium-brain = "visium_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
