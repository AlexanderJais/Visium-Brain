name: visium-brain
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - h5py>=3.9
  - pytables>=3.9
  - python-igraph>=0.11
  - leidenalg>=0.10
  - pyyaml>=6.0
  - tqdm>=4.66
  - click>=8.1
  - pillow>=10.0
  - opencv
  - pip:
      - scanpy>=1.10.0
      - anndata>=0.10.0
      - harmonypy>=0.0.10
      - squidpy>=1.5.0
      # Optional extras (spatialdata, celltypist, scvi-tools, bin2cell)
      # are NOT installed here -- pyproject.toml declares them under
      # [project.optional-dependencies] so users can opt in via
      # `pip install -e ".[spatialdata]"` etc. Adding them at the env
      # layer caused them to be installed unconditionally, contradicting
      # the README's "optional extras" table.
